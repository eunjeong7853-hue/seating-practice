<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 자리 배치표</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏫 학급 자리 배치표</h1>
        
        <div class="settings-top">
            <div class="input-group">
                <label for="studentList">👨‍🎓 학생 명단 (이름,성별,고정행,고정열)</label>
                <span class="help-text">※ 고정 학생만 행,열 입력 (예: 김철수,남,1,1)</span>
                <textarea id="studentList" rows="10">
김철수,남,1,1
이영희,여,1,2
박민수,남
정수진,여
최동건,남
강유리,여
조현우,남
윤지아,여
장도윤,남
임서연,여
한건우,남
오지우,여
서우진,남
신하윤,여
권시우,남
황서현,여
안준호,남
송민지,여
전민준,남
홍은지,여
유예준,남
고수아,여
문태양,남
백채원,여
양하준,남
손윤아,여
배도현,남
허지민,여
김도현,남
이시아,여</textarea>
            </div>

            <div class="input-group">
                <label for="avoidList">🚫 띄어 앉힐 학생 (이름,이름) - 한 줄에 한 쌍</label>
                <textarea id="avoidList" rows="4" placeholder="예시:&#10;박민수,조현우"></textarea>
            </div>
        </div>

        <div class="settings-bottom">
            <div class="config-group">
                <div class="grid-settings">
                    <label>📏 구조:</label>
                    <input type="number" id="columns" value="6" min="2" max="10"> 열
                    <span>×</span>
                    <input type="number" id="rows" value="5" min="2" max="10"> 행
                </div>
                <div class="option-settings">
                    <label>
                        <input type="checkbox" id="mixGender" checked> 남녀 짝꿍
                    </label>
                    <label>
                        <input type="checkbox" id="avoidPrevious"> 🔄 직전 자리 피하기
                    </label>
                </div>
            </div>
            <div class="action-group">
                <button onclick="generateSeating()" class="generate-btn">자리 배치하기</button>
            </div>
        </div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">

        <div class="view-toggle">
            <label><input type="radio" name="viewMode" value="student" checked onchange="changeView()"> 👨‍🎓 학생용 (교탁이 위)</label>
            <label><input type="radio" name="viewMode" value="teacher" onchange="changeView()"> 👨‍🏫 교사용 (교탁이 아래)</label>
        </div>

        <div class="desk-container" id="deskContainer">
            <div class="teacher-desk">교탁 (칠판)</div>
            <div id="classroom" class="grid">
                </div>
        </div>

        <div class="history-section">
            <h3>💾 월별 자리 기록 관리</h3>
            <div class="history-controls">
                <input type="text" id="saveName" placeholder="저장할 이름 (예: 3월 자리)">
                <button onclick="saveCurrentLayout()" class="save-btn">현재 자리 저장</button>
            </div>
            <div class="history-controls mt-10">
                <select id="historySelect">
                    <option value="">저장된 기록 없음</option>
                </select>
                <button onclick="loadSelectedLayout()" class="load-btn">불러오기</button>
                <button onclick="deleteSelectedLayout()" class="delete-btn">기록 삭제</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
